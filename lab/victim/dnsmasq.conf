# Lab không có đường ra internet (default route bị xoá — ADR-16). no-resolv để
# dnsmasq không đọc /etc/resolv.conf và không hỏi upstream: truy vấn ngoài zone
# được trả lời ngay thay vì treo tới khi timeout, nên TC-08 chạy nhanh và ổn định.
no-resolv
no-hosts

# Chỉ nghe trên IP lab của victim. bind-interfaces để dnsmasq bind đúng địa chỉ
# này thay vì bind wildcard rồi tự lọc.
listen-address=10.20.0.10
bind-interfaces

# Zone lab: đủ một bản ghi A cho TC-07. Dạng address=/<tên>/<IP> khớp cả
# tên con (*.victim.lab), tiện cho test sau này.
address=/victim.lab/10.20.0.10

# Mặc định dnsmasq trả TTL 0 cho bản ghi address=. TC-08 phải chứng minh parser
# đọc đúng trường TTL, mà với TTL 0 thì một parser luôn trả 0 cũng "đúng" —
# test mất giá trị. Đặt một giá trị khác 0 và dễ nhận ra.
local-ttl=300

# Ghi mỗi truy vấn ra stderr → xem bằng `docker compose logs victim`, đối chiếu
# với gói DNS mà sensor bắt được.
log-queries
log-facility=-
