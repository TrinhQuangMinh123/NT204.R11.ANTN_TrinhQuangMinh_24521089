# Hai port cùng một nội dung: TC-13 kiểm tra việc nhận diện HTTP dựa trên payload
# chứ không chỉ dựa vào port chuẩn 80.
server {
    listen 80;
    listen 8081;
    server_name _;
    root /var/www/html;

    # nginx trả 405 khi POST vào file tĩnh. location này dùng return nên nhận mọi
    # method → chỗ để TC-05 gửi POST có body.
    location /submit {
        return 200 "received\n";
    }
}
