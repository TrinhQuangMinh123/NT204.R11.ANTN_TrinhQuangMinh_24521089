services:
  # Chế độ --pcap (ADR-10): không mạng, không capability, chạy bằng UID của host
  idps-offline:
    build: .
    image: idps            # service live (idps) sau này dùng chung image này
    volumes:
      - .:/app             # đọc PCAP và ghi output thẳng vào repo trên host
    # Compose chỉ đọc biến môi trường; UID/GID của shell thường không được export
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    cap_drop: [ALL]
    network_mode: none

  # Sensor (ADR-13): nằm giữa hai mạng, kernel chuyển tiếp gói, Python chỉ nghe
  idps:
    build: .
    image: idps
    volumes:
      - .:/app
    # Bắt gói = mở AF_PACKET → cần CAP_NET_RAW. Capability chỉ hiệu lực với uid 0,
    # nên service này chạy root (khác idps-offline) nhưng bỏ 13/14 quyền còn lại.
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    # Chuyển tiếp do kernel làm, dockerd bật giúp lúc tạo container (REQ-19.4)
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net_ext:
        ipv4_address: 10.10.0.254
        interface_name: ext0
      net_int:
        ipv4_address: 10.20.0.254
        interface_name: int0
    # Phase 1 chưa chạy capture; giữ container sống để Phase 4 exec vào
    command: ["sleep", "infinity"]

  # Attacker (ADR-13): bài 1 sinh traffic thường, bài sau sinh traffic tấn công
  attacker:
    build: ./lab/attacker
    image: idps-attacker
    # NET_ADMIN: tự thêm route · NET_RAW: ping, tcpdump mở interface
    # SETUID/SETGID: chỉ để tcpdump của Debian tự HẠ quyền xuống user tcpdump —
    # nó là thứ đọc dữ liệu do attacker tạo ra, càng ít quyền càng tốt.
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, SETUID, SETGID]
    # Không bind mount TEST/: PCAP ghi ra stdout rồi shell của host hứng lại, nhờ
    # vậy file thuộc về user host mà container không cần quyền ghi vào repo.
    networks:
      net_ext:
        ipv4_address: 10.10.0.10
    depends_on: [idps]
    # Docker chỉ cắm sẵn route trong net_ext; đường sang net_int phải tự khai và
    # phải trỏ qua sensor. exec để sleep thành PID 1 → nhận được SIGTERM khi down.
    command: ["sh", "-c", "ip route add 10.20.0.0/24 via 10.10.0.254 && ip route del default && exec sleep infinity"]

  # Victim (ADR-13, ADR-15): chạy các dịch vụ mà attacker gửi traffic tới
  victim:
    build: ./lab/victim
    image: idps-victim
    # Danh sách này tìm bằng cách bỏ hết rồi đọc log nginx, thêm từng vé đang thiếu:
    # NET_ADMIN         tự thêm route về mạng attacker
    # NET_BIND_SERVICE  bind port 80 (< 1024)
    # CHOWN             nginx master đổi chủ thư mục tạm sang www-data
    # SETUID/SETGID     nginx master hạ quyền worker xuống www-data
    # Không cần NET_RAW: victim không bắt gói.
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    networks:
      net_int:
        ipv4_address: 10.20.0.10
    depends_on: [idps]
    # nginx chạy foreground để làm PID 1 → nhận SIGTERM khi compose down
    command: ["sh", "-c", "ip route add 10.10.0.0/24 via 10.20.0.254 && ip route del default && dnsmasq && exec nginx -g 'daemon off;'"]

# Đường duy nhất giữa hai mạng là xuyên qua idps (REQ-19.5). Tính chất đó KHÔNG
# dựa vào internal: true (luật DOCKER-INTERNAL của Docker chặn luôn cả đường qua
# sensor) mà dựa vào việc attacker/victim chỉ có một route tới mạng kia, trỏ vào
# sensor, và default route bị xoá nên không còn lối ra host. Kiểm chứng: tắt idps
# thì curl thất bại. .1 của mỗi subnet Docker giữ, .254 là sensor.
networks:
  net_ext:
    driver_opts:
      # Docker 28+ mặc định thêm luật raw/PREROUTING
      #   -d <IP container> ! -i <bridge cua no> -j DROP
      # chặn đúng việc sensor chuyển tiếp gói giữa hai mạng. nat-unprotected bỏ
      # lớp đó. Không dùng internal: true vì nó thêm luật DOCKER-INTERNAL
      # "-i br_ext ! -d 10.10.0.0/24 -j DROP" — chặn nốt đường qua sensor.
      com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
    ipam:
      config:
        - subnet: 10.10.0.0/24
  net_int:
    driver_opts:
      # Docker 28+ mặc định thêm luật raw/PREROUTING
      #   -d <IP container> ! -i <bridge cua no> -j DROP
      # chặn đúng việc sensor chuyển tiếp gói giữa hai mạng. nat-unprotected bỏ
      # lớp đó. Không dùng internal: true vì nó thêm luật DOCKER-INTERNAL
      # "-i br_ext ! -d 10.10.0.0/24 -j DROP" — chặn nốt đường qua sensor.
      com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
    ipam:
      config:
        - subnet: 10.20.0.0/24
